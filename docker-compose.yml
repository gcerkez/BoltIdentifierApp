services:
  test:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm test
    environment:
      - CI=true

  coverage:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run test:coverage
    environment:
      - CI=true

  typecheck:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run typecheck

  lint:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run lint

  dev:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm start -- --host 0.0.0.0
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
